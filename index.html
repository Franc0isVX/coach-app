<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="always">
<title>Coach Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--border:#2e2e2e;
  --text:#f0f0f0;--muted:#666;--accent:#c8f135;--orange:#f1a035;--blue:#35d4f1;--red:#ff4d4d;
  --si:rgba(53,212,241,.08);--sb:rgba(53,212,241,.25);
  --gi:rgba(200,241,53,.08);--gb:rgba(200,241,53,.25);
  --oi:rgba(241,160,53,.08);--ob:rgba(241,160,53,.25);
  --nav:58px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;outline:none;}
input:focus,select:focus{border-color:var(--accent);}
select option{background:var(--surface2);}
.mono{font-family:'JetBrains Mono',monospace;}
/* Nav */
.bnav{position:fixed;bottom:0;left:0;right:0;height:var(--nav);background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom,0px);}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;color:var(--muted);font-size:9px;font-family:'Inter',sans-serif;padding:4px 0;}
.ni.on{color:var(--accent);}
.ni .ic{font-size:20px;line-height:1;}
/* Layout */
.page{padding:10px 12px calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px));max-width:100%;}
/* Cal */
.cal-hdr{display:flex;align-items:center;padding:10px 14px;gap:8px;cursor:pointer;background:var(--surface);border-bottom:1px solid var(--border);}
.cal-body{overflow:hidden;transition:max-height .3s ease;background:var(--surface);border-bottom:1px solid var(--border);}
/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;}
.card2{background:var(--surface2);border:1px solid var(--border);border-radius:8px;}
/* Meals */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:380px){.mg{grid-template-columns:1fr;}}
/* Header */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

<script type="text/babel">
const {useState,useEffect,useRef} = React;

// Configuration locale sans serveur (GitHub Pages)
const TK    = 1965;
const RK    = 1665;
const MP    = {p:177,l:88};

// Fonctions de gestion du stockage local du téléphone
function localGet(key) {
  try { return JSON.parse(localStorage.getItem('hyrox_' + key)) || {}; } 
  catch { return {}; }
}
function localSet(key, data) {
  localStorage.setItem('hyrox_' + key, JSON.stringify(data));
}

const MEALS = [{id:'matin',l:'Matin',ic:'☀️'},{id:'midi',l:'Midi',ic:'🌤️'},{id:'collation',l:'Collation',ic:'🍎'},{id:'soir',l:'Soir',ic:'🌙'}];
const TABS  = [{id:'nutrition',ic:'🍽',l:'Nutrition'},{id:'training',ic:'🏋️',l:'Séances'},{id:'analytics',ic:'📊',l:'Stats'},{id:'recettes',ic:'📖',l:'Recettes'},{id:'coach',ic:'🤖',l:'Coach'}];

const BF = {
  'Poulet (blanc,cuit)':{kcal:165,p:31,l:3.6,g:0,unit:'g'},
  'Saumon (cuit)':{kcal:208,p:20,l:13,g:0,unit:'g'},
  'Thon en boîte':{kcal:116,p:26,l:1,g:0,unit:'g'},
  'Œufs entiers':{kcal:155,p:13,l:11,g:1,unit:'unit',uw:60},
  "Blancs d'œufs":{kcal:52,p:11,l:0.2,g:1,unit:'unit',uw:35},
  'Bœuf haché 5%':{kcal:137,p:21,l:5,g:0,unit:'g'},
  'Fromage blanc 0%':{kcal:45,p:8,l:0.2,g:3.5,unit:'g'},
  'Skyr nature':{kcal:65,p:11,l:0.2,g:4,unit:'g'},
  'Whey protéine':{kcal:380,p:75,l:5,g:8,unit:'g'},
  'Riz basmati (cuit)':{kcal:130,p:2.7,l:0.3,g:28,unit:'g'},
  'Pâtes (cuites)':{kcal:131,p:5,l:1,g:25,unit:'g'},
  "Flocons d'avoine":{kcal:370,p:13,l:7,g:60,unit:'g'},
  'Pain complet':{kcal:247,p:9,l:3,g:44,unit:'g'},
  'Patate douce (cuite)':{kcal:90,p:2,l:0.1,g:21,unit:'g'},
  'Banane':{kcal:89,p:1.1,l:0.3,g:23,unit:'unit',uw:120},
  'Épinards':{kcal:23,p:2.9,l:0.4,g:3.6,unit:'g'},
  'Brocolis':{kcal:35,p:2.4,l:0.4,g:7,unit:'g'},
  'Avocat':{kcal:160,p:2,l:15,g:9,unit:'g'},
  'Amandes':{kcal:579,p:21,l:50,g:22,unit:'g'},
  'Yaourt grec entier':{kcal:97,p:9,l:5,g:3.6,unit:'g'},
  "Huile d'olive":{kcal:884,p:0,l:100,g:0,unit:'ml'},
  'Jambon blanc':{kcal:107,p:17,l:3,g:2,unit:'g'},
  'Feta':{kcal:264,p:14,l:21,g:4,unit:'g'},
};

function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return dstr(new Date());}
function gew(f,q){if(!f||!q||q<=0)return 0;return f.unit==='unit'?q*(f.uw||100):q;}
function totals(meals,foods){
  let k=0,p=0,l=0,g=0;
  MEALS.forEach(s=>{(meals[s.id]||[]).forEach(r=>{const f=foods[r.food];if(f){const gr=gew(f,r.qty);if(gr>0){const x=gr/100;k+=f.kcal*x;p+=f.p*x;l+=f.l*x;g+=f.g*x;}}});});
  return{kcal:Math.round(k),p:Math.round(p),l:Math.round(l),g:Math.round(g)};
}

function Bar({v,max,c='var(--accent)'}){
  return <div style={{height:4,background:'var(--border)',borderRadius:99,overflow:'hidden'}}>
    <div style={{height:'100%',width:Math.min((v/max)*100,100)+'%',background:v>max?'var(--red)':c,borderRadius:99,transition:'width .3s'}}/>
  </div>;
}

function App(){
  const [tab,setTab]     = useState('nutrition');
  const [sel,setSel]     = useState(today());
  const [vy,setVy]       = useState(new Date().getFullYear());
  const [vm,setVm]       = useState(new Date().getMonth());
  const [calOpen,setCal] = useState(false);
  const [days,setDays]   = useState({});
  const [cf,setCf]       = useState({});
  const [recs,setRecs]   = useState({});
  const [sess,setSess]   = useState({});
  const [nas,setNas]     = useState('...');
  const [badge,setBadge] = useState('');
  const [aiMsgs,setAiMsgs] = useState([]);
  const [aiIn,setAiIn]   = useState('');
  const [aiLoad,setAiLoad] = useState(false);
  const [addFood,setAddFood] = useState(false);
  const [nf,setNf']       = useState({name:'',kcal:'',p:'',l:'',g:'',unit:'g'});
  const [rtab,setRtab]   = useState('list');
  const [nr,setNr]       = useState({name:'',portions:1,desc:'',ings:[{food:'',qty:0}]});
  const [addSess,setAddSess] = useState(false);
  const [editSess,setEditSess] = useState(null);
  const [ns,setNs]       = useState({date:'',title:'',type:'Cardio',duree:60,statut:'À faire',source:'Manuel',calories:0});
  const chatRef          = useRef(null);

  useEffect(()=>{
    setDays(localGet('days'));
    setCf(localGet('foods'));
    setRecs(localGet('recipes'));
    setSess(localGet('sessions'));
    setNas('ok'); // Indicateur mode local activé
    flash('✓ Mode Local Activé');
  },[]);

  function flash(m){setBadge(m);setTimeout(()=>setBadge(''),3000);}

  const af = {...BF,...cf};
  const afw = {...af};
  Object.entries(recs).forEach(([n,r])=>{
    if(r.totals&&r.portions) afw['[R] '+n]={kcal:Math.round(r.totals.kcal/r.portions),p:Math.round(r.totals.p/r.portions*10)/10,l:Math.round(r.totals.l/r.portions*10)/10,g:Math.round(r.totals.g/r.portions*10)/10,unit:'unit',uw:1,ul:'portion(s)'};
  });

  const gdt  = ds=>sess[ds]?'notion':'rest';
  const istr = ds=>{const t=gdt(ds);return t==='notion'||t==='training';};
  const gtgt = ds=>istr(ds)?TK:RK;
  const gm   = ds=>days[ds]?.meals||{matin:[],midi:[],collation:[],soir:[]};
  const gt   = ds=>totals(gm(ds),afw);
  const gb   = ds=>days[ds]?.cal||0;

  async function saveDay(dd,ds){setDays(dd); localSet('days', dd);}
  async function saveCf(){if(!nf.name||!nf.kcal)return;const c={...cf,[nf.name]:{kcal:+nf.kcal,p:+nf.p||0,l:+nf.l||0,g:+nf.g||0,unit:nf.unit}};setCf(c); localSet('foods',c); flash('✓ '+nf.name);setNf({name:'',kcal:'',p:'',l:'',g:'',unit:'g'});setAddFood(false);}

  function rTotals(ings){let k=0,p=0,l=0,g=0;ings.forEach(r=>{const f=af[r.food];if(f&&r.qty>0){const gr=gew(f,r.qty);const x=gr/100;k+=f.kcal*x;p+=f.p*x;l+=f.l*x;g+=f.g*x;}});return{kcal:Math.round(k),p:Math.round(p),l:Math.round(l),g:Math.round(g)};}
  async function saveRec(){if(!nr.name)return;const ings=nr.ings.filter(i=>i.food&&i.qty>0);if(!ings.length)return;const t=rTotals(ings);const r={...recs,[nr.name]:{portions:nr.portions,desc:nr.desc,ingredients:ings,totals:t}};setRecs(r); localSet('recipes',r); flash('✓ '+nr.name);setNr({name:'',portions:1,desc:'',ings:[{food:'',qty:0}]});setRtab('list');}
  async function delRec(n){const r={...recs};delete r[n];setRecs(r); localSet('recipes',r);}

  async function saveSess(s){setSess(s); localSet('sessions',s); flash('✓ Séances');}
  async function saveNewSess(){if(!ns.title||!ns.date)return;await saveSess({...sess,[ns.date]:{title:ns.title,type:ns.type,duree:+ns.duree,statut:ns.statut,source:ns.source||'Manuel',calories:+ns.calories||0}});setNs({date:'',title:'',type:'Cardio',duree:60,statut:'À faire',source:'Manuel',calories:0});setAddSess(false);}
  async function updSess(ds){await saveSess({...sess,[ds]:{...editSess}});setEditSess(null);}
  async function delSess(ds){const s={...sess};delete s[ds];await saveSess(s);}

  function setCal2(ds,v){const dd=JSON.parse(JSON.stringify(days));if(!dd[ds])dd[ds]={meals:{matin:[],midi:[],collation:[],soir:[]}};dd[ds].cal=v;saveDay(dd,ds);}
  function addRow(ds,mid){const dd=JSON.parse(JSON.stringify(days));if(!dd[ds])dd[ds]={meals:{matin:[],midi:[],collation:[],soir:[]}};dd[ds].meals[mid]=[...(dd[ds].meals[mid]||[]),{food:'',qty:0}];saveDay(dd,ds);}
  function updRow(ds,mid,idx,fld,val){const dd=JSON.parse(JSON.stringify(days));if(!dd[ds])dd[ds]={meals:{matin:[],midi:[],collation:[],soir:[]}};const row=dd[ds].meals[mid][idx];if(!row)return;if(fld==='food'){row.food=val;row.qty=0;}else row.qty=parseFloat(val)||0;saveDay(dd,ds);}
  function delRow(ds,mid,idx){const dd=JSON.parse(JSON.stringify(days));dd[ds].meals[mid].splice(idx,1);saveDay(dd,ds);}

  async function sendAI(){
    if(!aiIn.trim())return;
    const msg=aiIn.trim();setAiIn('');
    const msgs=[...aiMsgs,{role:'user',content:msg}];
    setAiMsgs(msgs);setAiLoad(true);
    setTimeout(()=>{if(chatRef.current)chatRef.current.scrollTop=chatRef.current.scrollHeight;},50);
    try{
      const t=gt(sel),tgt=gtgt(sel),s=sess[sel];
      const sys='Tu es Coach HYROX. Jour:'+sel+' | '+tgt+'kcal obj | '+t.kcal+'kcal conso | P:'+t.p+'g L:'+t.l+'g G:'+t.g+'g'+(s?' | Séance:'+s.title:'')+(gb(sel)>0?' | '+gb(sel)+'kcal brûlées':'')+'. Réponds en français, max 120 mots.';
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:500,system:sys,messages:msgs})});
      const data=await res.json();
      setAiMsgs([...msgs,{role:'assistant',content:data.content?.[0]?.text||'Erreur.'}]);
    }catch{setAiMsgs([...msgs,{role:'assistant',content:'Erreur connexion.'}]);}
    setAiLoad(false);
    setTimeout(()=>{if(chatRef.current)chatRef.current.scrollTop=chatRef.current.scrollHeight;},100);
  }

  // ── Calendrier ──
  function Cal(){
    const months=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];
    const fd=new Date(vy,vm,1).getDay();
    const off=fd===0?6:fd-1;
    const dim=new Date(vy,vm+1,0).getDate();
    const cells=[];
    ['Lu','Ma','Me','Je','Ve','Sa','Di'].forEach(d=>cells.push(<div key={'w'+d} style={{textAlign:'center',fontSize:9,color:'var(--muted)',paddingBottom:3,fontFamily:"'JetBrains Mono',monospace"}}>{d}</div>));
    for(let i=0;i<off;i++)cells.push(<div key={'e'+i}/>);
    for(let d=1;d<=dim;d++){
      const ds=vy+'-'+String(vm+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const isT=ds===today(),isSel=ds===sel,hasSes=!!sess[ds],hasDat=gt(ds).kcal>0;
      let bg='transparent',br='transparent',tc='var(--text)';
      if(isT){bg='var(--accent)';tc='#000';}
      else if(isSel){br='var(--accent)';}
      else if(hasSes){bg='rgba(53,212,241,.1)';}
      cells.push(<div key={ds} onClick={()=>{setSel(ds);setCal(false);}} style={{aspectRatio:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',borderRadius:6,cursor:'pointer',border:'1px solid '+br,background:bg,color:tc,fontSize:11,fontWeight:600,gap:2,position:'relative'}}>
        <span>{d}</span>
        {hasDat&&<div style={{width:3,height:3,borderRadius:'50%',background:isT?'#000':'var(--blue)'}}/>}
        {hasSes&&!isT&&<div style={{position:'absolute',top:2,right:2,width:4,height:4,borderRadius:'50%',background:'var(--blue)'}}/>}
      </div>);
    }
    return <div style={{padding:'0 10px 10px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <button onClick={()=>{let m=vm-1,y=vy;if(m<0){m=11;y--;}setVm(m);setVy(y);}} style={{width:28,height:28,background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:6,fontSize:14}}>‹</button>
        <span style={{fontSize:12,fontWeight:600,fontFamily:"'JetBrains Mono',monospace"}}>{months[vm]} {vy}</span>
        <button onClick={()=>{let m=vm+1,y=vy;if(m>11){m=0;y++;}setVm(m);setVy(y);}} style={{width:28,height:28,background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:6,fontSize:14}}>›</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}}>{cells}</div>
    </div>;
  }

  const sT=gt(sel),sTgt=gtgt(sel),sSes=sess[sel],sB=gb(sel),sAdj=sTgt+sB,sRem=sAdj-sT.kcal;
  const wk=Array.from({length:7},(_,i)=>{const t=new Date(),dw=t.getDay(),mo=new Date(t);mo.setDate(t.getDate()+(dw===0?-6:1-dw));const d=new Date(mo);d.setDate(mo.getDate()+i);const ds=dstr(d);return{ds,day:['Lu','Ma','Me','Je','Ve','Sa','Di'][i],kcal:gt(ds).kcal,target:gtgt(ds),isTr:istr(ds)};});
  const selLabel=new Date(sel+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
  const mono={fontFamily:"'JetBrains Mono',monospace"};
  const card={background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10};
  const btnB={border:'1px solid var(--border)',borderRadius:6,background:'var(--surface2)',color:'var(--muted)',padding:'4px 10px',fontSize:10,...mono,cursor:'pointer'};
  const btnG={...btnB,borderColor:'var(--accent)',color:'var(--accent)',background:'var(--gi)'};

  function Nutrition(){
    const dtC=sSes?{bg:'var(--si)',tc:'var(--blue)',b:'var(--sb)'}:{bg:'var(--surface2)',tc:'var(--muted)',b:'var(--border)'};
    return <div>
      {/* Résumé */}
      <div style={{...card,padding:'10px 12px',marginBottom:10}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
          <div style={{fontSize:14,fontWeight:600,flex:1,textTransform:'capitalize'}}>{new Date(sel+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div>
          <span style={{fontSize:10,padding:'2px 8px',borderRadius:20,background:dtC.bg,color:dtC.tc,border:'1px solid '+dtC.b,...mono}}>{sSes?'⚡ SÉANCE':'💤 REPOS'}</span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6,marginBottom:8}}>
          {[{v:sT.kcal,l:'Consommé',c:sT.kcal>sAdj?'var(--red)':'var(--accent)'},{v:sAdj,l:sB>0?'Obj.ajusté':'Objectif',c:'var(--orange)'},{v:Math.abs(sRem),l:sRem>=0?'Restantes':'Surplus',c:sRem<0?'var(--red)':'var(--text)'}].map((k,i)=>(
            <div key={i} style={{textAlign:'center',background:'var(--surface2)',borderRadius:8,padding:'7px 4px'}}>
              <div style={{fontSize:17,fontWeight:700,...mono,color:k.c}}>{k.v}</div>
              <div style={{fontSize:9,color:'var(--muted)'}}>{k.l}</div>
            </div>
          ))}
        </div>
        <Bar v={sT.kcal} max={sAdj}/>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:5,marginTop:8}}>
          {[{l:'PROT',v:sT.p,t:MP.p,c:'var(--blue)'},{l:'LIP',v:sT.l,t:MP.l,c:'var(--orange)'},{l:'GLUC',v:sT.g,t:Math.round(sAdj*0.4/4),c:'var(--accent)'}].map(m=>(
            <div key={m.l} style={{background:'var(--surface2)',borderRadius:7,padding:'5px 6px'}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:9,marginBottom:2}}>
                <span style={{color:m.c,fontWeight:600,...mono}}>{m.l}</span>
                <span style={{color:'var(--muted)',...mono}}>{m.v}g</span>
              </div>
              <Bar v={m.v} max={m.t} c={m.c}/>
              <div style={{fontSize:8,color:'var(--muted)',...mono,textAlign:'right',marginTop:1}}>/{m.t}g</div>
            </div>
          ))}
        </div>
      </div>
      {/* Séance + calories brûlées */}
      <div style={{...card,padding:'10px 12px',marginBottom:10}}>
        {sSes&&<div style={{background:'var(--si)',border:'1px solid var(--sb)',borderRadius:7,padding:'7px 10px',marginBottom:8,display:'flex',gap:8,alignItems:'center'}}>
          <span style={{fontSize:16}}>🏋️</span>
          <div style={{flex:1}}>
            <div style={{fontSize:11,fontWeight:600,marginBottom:2}}>{sSes.title}</div>
            <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
              {[sSes.type,sSes.duree+'min',sSes.calories>0?'🔥'+sSes.calories+'kcal':null].filter(Boolean).map((t,i)=>(
                <span key={i} style={{fontSize:9,padding:'1px 5px',borderRadius:4,background:'var(--surface2)',color:'var(--muted)',border:'1px solid var(--border)',...mono}}>{t}</span>
              ))}
            </div>
          </div>
        </div>}
        <div style={{display:'flex',alignItems:'center',gap:8,background:'var(--surface2)',borderRadius:7,padding:'7px 10px'}}>
          <span style={{fontSize:14}}>🔥</span>
          <span style={{fontSize:11,color:'var(--muted)',flex:1}}>Calories brûlées</span>
          <input type="number" min={0} step={10} value={days[sel]?.cal||''} placeholder="0"
            onChange={e=>setCal2(sel,+e.target.value||0)}
            style={{width:65,fontSize:13,padding:'4px 6px',textAlign:'center',...mono}}/>
          <span style={{fontSize:10,color:'var(--muted)',...mono}}>kcal</span>
        </div>
      </div>
      {/* Repas */}
      <div className="mg">
        {MEALS.map(slot=>{
          const rows=gm(sel)[slot.id]||[];
          const mk=Math.round(rows.reduce((s,r)=>{const f=afw[r.food];if(!f||!r.qty)return s;const g=gew(f,r.qty);return s+(g>0?f.kcal*g/100:0);},0));
          return <div key={slot.id} style={{...card,overflow:'hidden'}}>

                </select>
                <div style={{display:'flex',alignItems:'center',gap:2}}>
                  <input type="number" min={0} step={f?.unit==='unit'?1:5} value={row.qty||''} placeholder="0" onChange={e=>updRow(sel,slot.id,idx,'qty',e.target.value)} style={{width:36,fontSize:10,padding:'2px 2px',textAlign:'center',...mono}}/>
                  <span style={{fontSize:8,color:'var(--muted)',...mono}}>{ul}</span>
                </div>
                <span style={{fontSize:10,color:'var(--accent)',fontWeight:600,...mono,textAlign:'right'}}>{rk>0?rk:'—'}</span>
                <button onClick={()=>delRow(sel,slot.id,idx)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',fontSize:12}}>✕</button>
              </div>;
            })}
            <div style={{padding:'3px 7px'}}>
              <button onClick={()=>addRow(sel,slot.id)} style={{width:'100%',padding:'3px',fontSize:10,border:'1px dashed var(--border)',borderRadius:4,background:'none',color:'var(--muted)',cursor:'pointer'}}>+ Ajouter</button>
            </div>
          </div>;
        })}
      </div>
      <div style={{marginTop:10}}>
        {!addFood
          ?<button onClick={()=>setAddFood(true)} style={{...btnB,width:'100%',padding:'8px',textAlign:'center',fontSize:11}}>⊕ Aliment personnalisé</button>

            <div style={{fontSize:12,fontWeight:600,marginBottom:8}}>Nouvel aliment</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:5,marginBottom:8}}>
              {[{k:'name',ph:'Nom',full:true},{k:'kcal',ph:'Kcal/100g'},{k:'p',ph:'Protéines'},{k:'l',ph:'Lipides'},{k:'g',ph:'Glucides'}].map(x=>(

            </div>
          </div>
        }
      </div>
    </div>;
  }

        </div>}
        {aiMsgs.map((m,i)=>(
          <div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start'}}>
            <div style={{maxWidth:'82%',padding:'8px 11px',borderRadius:10,fontSize:12,lineHeight:1.6,background:m.role==='user'?'var(--si)':'var(--surface)',color:m.role==='user'?'var(--blue)':'var(--text)',border:'1px solid '+(m.role==='user'?'var(--sb)':'var(--border)')}}>{m.content}</div>
          </div>
        ))}
        {aiLoad&&<div style={{display:'flex環境'}}><div style={{padding:'7px 12px',borderRadius:10,...card,fontSize:12,color:'var(--muted)'}}>Coach réfléchit…</div></div>}
      </div>
      <div style={{display:'flex',gap:7,paddingTop:6}}>
        <input value={aiIn} onChange={e=>setAiIn(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&sendAI()} placeholder="Pose ta question…" style={{flex:1,padding:'9px 12px',fontSize:12,borderRadius:8}}/>
        <button onClick={sendAI} disabled={aiLoad||!aiIn.trim()} style={{...btnG,padding:'9px 14px',fontSize:12,opacity:(aiLoad||!aiIn.trim())?0.5:1}}>↗</button>
      </div>
    </div>;
  }

  return <div style={{minHeight:'100vh',background:'var(--bg)'}}>
    {/* Header */}
    <div className="hdr">
      <div style={{flex:1}}>
        <div style={{fontSize:14,fontWeight:700,letterSpacing:'-0.3px'}}>COACH <span style={{color:'var(--accent)'}}>DASHBOARD</span></div>
        <div style={{fontSize:8,color:'var(--muted)',...mono}}>HYROX · MAASTRICHT 2026</div>
      </div>
      <span style={{fontSize:9,padding:'3px 8px',borderRadius:20,...mono,background:nas==='ok'?'var(--gi)':'rgba(255,77,77,.08)',color:nas==='ok'?'var(--accent)':'var(--red)',border:'1px solid '+(nas==='ok'?'var(--gb)':'rgba(255,77,77,.25)')}}>
        {nas==='ok'?'📱 STANDALONE':'⚠ ERR'}
      </span>
      {badge&&<span style={{fontSize:9,color:'var(--accent)',...mono}}>{badge}</span>}
    </div>

    {/* Calendrier collapsible */}
    <div className="cal-hdr" onClick={()=>setCal(o=>!o)}>
      <div style={{flex:1,fontSize:13,fontWeight:600}}>
        <span style={{color:'var(--accent)'}}>{selLabel}</span>
        {sSes&&<span style={{fontSize:10,color:'var(--blue)',marginLeft:6,...mono}}>⚡ {sSes.title.slice(0,22)}{sSes.title.length>22?'…':''}</span>}
      </div>
      <span style={{fontSize:10,color:'var(--muted)',...mono}}>Calendrier</span>
      <span style={{fontSize:16,color:'var(--muted)',marginLeft:4}}>{calOpen?'▲':'▼'}</span>
    </div>
    <div className="cal-body" style={{maxHeight:calOpen?'320px':'0'}}><Cal/></div>

    {/* Contenu principal */}
    <div className="page">
      {tab==='nutrition' &&<Nutrition/>}
      {tab==='training'  &&<Training/>}
      {tab==='analytics' &&<Analytics/>}
      {tab==='recettes'  &&<Recettes/>}
      {tab==='coach'     &&<Coach/>}
    </div>

    {/* Barre de navigation basse */}
    <nav className="bnav">
      {TABS.map(t=>(
        <button key={t.id} className={'ni'+(tab===t.id?' on':'')} onClick={()=>setTab(t.id)}>
          <span className="ic">{t.ic}</span>
          <span>{t.l}</span>
        </button>
      ))}
    </nav>
  </div>;
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
