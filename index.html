*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--border:#2e2e2e;
  --text:#f0f0f0;--muted:#666;--accent:#c8f135;--orange:#f1a035;--blue:#35d4f1;--red:#ff4d4d;
  --si:rgba(53,212,241,.08);--sb:rgba(53,212,241,.25);
  --gi:rgba(200,241,53,.08);--gb:rgba(200,241,53,.25);
  --oi:rgba(241,160,53,.08);--ob:rgba(241,160,53,.25);
  --nav:58px;
}
*{box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none;}
button{font-family:inherit;cursor:pointer;}
input,select{
  font-family:inherit;
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:6px;
  outline:none;
  /* Anti-zoom iOS — min 16px */
  font-size:16px;
}
input:focus,select:focus{border-color:var(--accent);}
select option{background:var(--surface2);}
.mono{font-family:'JetBrains Mono',monospace;}

/* Nav */
.bnav{position:fixed;bottom:0;left:0;right:0;height:var(--nav);background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom,0px);}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;color:var(--muted);font-size:9px;font-family:'Inter',sans-serif;padding:4px 0;}
.ni.on{color:var(--accent);}
.ni .ic{font-size:20px;line-height:1;}

/* Layout */
.page{padding:10px 12px calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px));max-width:100%;}

/* Cal */
.cal-hdr{display:flex;align-items:center;padding:10px 14px;gap:8px;cursor:pointer;background:var(--surface);border-bottom:1px solid var(--border);}
.cal-body{overflow:hidden;transition:max-height .3s ease;background:var(--surface);border-bottom:1px solid var(--border);}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;}

/* Header */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;}

/* ── Repas : layout une ligne par aliment ── */
.meal-row{
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:6px 8px;
  border-bottom:1px solid var(--border);
}
.meal-row-top{
  display:flex;
  align-items:center;
  gap:6px;
}
.meal-row-top select{
  flex:1;
  font-size:15px;
  padding:5px 6px;
  border-radius:6px;
  min-width:0;
}
.meal-row-bottom{
  display:flex;
  align-items:center;
  gap:8px;
}
.meal-row-bottom input[type=number]{
  width:80px;
  font-size:15px;
  padding:5px 8px;
  text-align:center;
  border-radius:6px;
  font-family:'JetBrains Mono',monospace;
}
.meal-unit{
  font-size:11px;
  color:var(--muted);
  font-family:'JetBrains Mono',monospace;
  min-width:24px;
}
.meal-kcal{
  font-size:12px;
  color:var(--accent);
  font-weight:600;
  font-family:'JetBrains Mono',monospace;
  margin-left:auto;
}
.meal-del{
  background:none;
  border:none;
  cursor:pointer;
  color:var(--muted);
  font-size:16px;
  padding:2px 4px;
  flex-shrink:0;
}

/* Meals grid 2 colonnes */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:400px){.mg{grid-template-columns:1fr;}}
</style>

function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return dstr(new Date());}
function gew(f,q){if(!f||!q||q<=0)return 0;return f.unit==='unit'?q*(f.uw||100):q;}
function totals(meals,foods){
  let k=0,p=0,l=0,g=0;
  MEALS.forEach(s=>{(meals[s.id]||[]).forEach(r=>{const f=foods[r.food];if(f){const gr=gew(f,r.qty);if(gr>0){const x=gr/100;k+=f.kcal*x;p+=f.p*x;l+=f.l*x;g+=f.g*x;}}});});
  return{kcal:Math.round(k),p:Math.round(p),l:Math.round(l),g:Math.round(g)};
}

function Bar({v,max,c='var(--accent)'}){
  return <div style={{height:4,background:'var(--border)',borderRadius:99,overflow:'hidden'}}>
    <div style={{height:'100%',width:Math.min((v/max)*100,100)+'%',background:v>max?'var(--red)':c,borderRadius:99,transition:'width .3s'}}/>
  </div>;
}

// FoodRow: défini hors App pour référence stable (évite remount iOS clavier).
function FoodRow({slot, row, idx, afw, sel, updRow, delRow, addCF}){
  const f = afw[row.food];
  const ul = f?(f.ul||(f.unit==='unit'?'u':f.unit==='ml'?'ml':'g')):'g';
  const [localQty, setLocalQty] = useState(row.qty||'');
  const [fsearch, setFsearch] = useState(row.food||'');
  const [fdrop, setFdrop] = useState(false);
  const [offRes, setOffRes] = useState([]);
  const [offLoad, setOffLoad] = useState(false);
  const offTimer = useRef(null);
  const isFocused = useRef(false);
  useEffect(()=>{ if(!isFocused.current) setLocalQty(row.qty||''); },[row.qty]);
  useEffect(()=>{ setFsearch(row.food||''); },[row.food]);
  const foodKeys = Object.keys(afw);
  const q = fsearch.toLowerCase().replace('[r] ','');
  const filtered = q ? foodKeys.filter(x=>x.toLowerCase().replace('[r] ','').includes(q)) : foodKeys;
  const sorted = [...filtered.filter(x=>x.startsWith('[R]')).sort(),...filtered.filter(x=>!x.startsWith('[R]')).sort()].slice(0,25);
  useEffect(()=>{
    clearTimeout(offTimer.current);
    if(fsearch.length < 3 || sorted.length >= 10){ setOffRes([]); return; }
    setOffLoad(true);
    offTimer.current = setTimeout(async ()=>{
      try{
        const enc = encodeURIComponent(fsearch);
        const res = await fetch('https://world.openfoodfacts.org/cgi/search.pl?search_terms='+enc+'&search_simple=1&action=process&json=1&fields=product_name,nutriments&page_size=5');
        const data = await res.json();
        const products = (data.products||[])
          .filter(p=>p.product_name && p.nutriments && p.nutriments['energy-kcal_100g'])
          .map(p=>({
            name: p.product_name,
            kcal: Math.round(p.nutriments['energy-kcal_100g']||0),
            p: Math.round((p.nutriments['proteins_100g']||0)*10)/10,
            l: Math.round((p.nutriments['fat_100g']||0)*10)/10,
            g: Math.round((p.nutriments['carbohydrates_100g']||0)*10)/10,
            unit: 'g'
          }));
        setOffRes(products);
      }catch{ setOffRes([]); }
      setOffLoad(false);
    }, 700);
    return ()=>clearTimeout(offTimer.current);
  },[fsearch, sorted.length]);
  const rk = f&&+localQty>0 ? Math.round(f.kcal*gew(f,+localQty)/100) : 0;
  return <div className="meal-row" style={{position:'relative',zIndex:fdrop?100:1}}>
    <div className="meal-row-top">
      <div style={{flex:1,position:'relative'}}>
        <input value={fsearch} inputMode="text" placeholder="Rechercher un aliment..."
          onFocus={()=>setFdrop(true)}
          onBlur={()=>setTimeout(()=>setFdrop(false),150)}
          onChange={e=>{setFsearch(e.target.value);setFdrop(true);}}
          style={{width:'100%',fontSize:15,padding:'5px 6px',borderRadius:6}}/>
        {fdrop&&(sorted.length>0||offLoad||offRes.length>0)&&<div style={{position:'absolute',top:'calc(100% + 2px)',left:0,right:0,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,zIndex:999,maxHeight:180,overflowY:'auto',boxShadow:'0 6px 16px rgba(0,0,0,.6)'}}>
          {sorted.map(x=>(
            <div key={x}
              onPointerDown={e=>{e.preventDefault();const disp=x.startsWith('[R]')?x.replace('[R] ',''):x;setFsearch(disp);updRow(sel,slot.id,idx,'food',x);setFdrop(false);}}
              style={{padding:'8px 10px',fontSize:13,cursor:'pointer',borderBottom:'1px solid var(--border)',color:x.startsWith('[R]')?'var(--accent)':'var(--text)'}}>
              {x.startsWith('[R]')?'⭐ '+x.replace('[R] ',''):x}
            </div>
          ))}
          {offLoad&&<div style={{padding:'8px 10px',fontSize:12,color:'var(--muted)'}}>🌐 Recherche...</div>}
          {!offLoad&&offRes.length>0&&<div>
            <div style={{padding:'4px 10px',fontSize:10,color:'var(--muted)',fontWeight:600,background:'var(--surface2)',letterSpacing:'0.05em'}}>OPEN FOOD FACTS</div>
            {offRes.map((p,i)=>(
              <div key={i}
                onPointerDown={e=>{e.preventDefault();addCF(p.name,{kcal:p.kcal,p:p.p,l:p.l,g:p.g,unit:'g'});updRow(sel,slot.id,idx,'food',p.name);setFsearch(p.name);setFdrop(false);setOffRes([]);}}
                style={{padding:'8px 10px',fontSize:13,cursor:'pointer',borderBottom:'1px solid var(--border)',color:'var(--blue)'}}>
                {p.name} <span style={{fontSize:10,color:'var(--muted)'}}>{p.kcal}kcal · P:{p.p}g L:{p.l}g G:{p.g}g</span>
              </div>
            ))}
          </div>}
        </div>}
      </div>
      <button className="meal-del" onClick={()=>delRow(sel,slot.id,idx)}>✕</button>
    </div>
    <div className="meal-row-bottom">
      <input type="number" inputMode="decimal" min={0} step={f?.unit==='unit'?1:5}
        value={localQty} placeholder="Quantite"
        onFocus={()=>isFocused.current=true}
        onBlur={e=>{isFocused.current=false; updRow(sel,slot.id,idx,'qty',e.target.value);}}
        onChange={e=>setLocalQty(e.target.value)}/>
      <span className="meal-unit">{ul}</span>
      <span className="meal-kcal">{rk>0?rk+' kcal':'—'}</span>
    </div>
  </div>;
}

  useEffect(()=>{

    flash('✓ Données chargées');
    const last=parseInt(localStorage.getItem('hyrox_lastexport')||'0');

  function flash(m){setBadge(m);setTimeout(()=>setBadge(''),3000);}

  const af={...BF,...cf};
  const afw={...af};
  Object.entries(recs).forEach(([n,r])=>{
    if(r.totals&&r.portions>0) afw['[R] '+n]={kcal:Math.round(r.totals.kcal/r.portions),p:Math.round(r.totals.p/r.portions*10)/10,l:Math.round(r.totals.l/r.portions*10)/10,g:Math.round(r.totals.g/r.portions*10)/10,unit:'unit',uw:1,ul:'portion(s)'};
  });

  const gdt  = ds=>sess[ds]?'notion':'rest';
  const istr = ds=>{const t=gdt(ds);return t==='notion'||t==='training';};
  const gtgt = ds=>istr(ds)?TK:RK;
  const gm   = ds=>days[ds]?.meals||{matin:[],midi:[],collation:[],soir:[]};
  const gt   = ds=>totals(gm(ds),afw);
  const gb   = ds=>sess[ds]?.calories||days[ds]?.cal||0;

  function saveDay(dd){setDays(dd);if(saveDayTimer.current)clearTimeout(saveDayTimer.current);saveDayTimer.current=setTimeout(()=>{localSet('days',dd);queueSync('days',dd);},800);}
  function addRow(ds,mid){const dd=JSON.parse(JSON.stringify(days));if(!dd[ds])dd[ds]={meals:{matin:[],midi:[],collation:[],soir:[]}};dd[ds].meals[mid]=[...(dd[ds].meals[mid]||[]),{food:'',qty:0}];saveDay(dd,ds);}
  function updRow(ds,mid,idx,fld,val){const dd=JSON.parse(JSON.stringify(days));if(!dd[ds])dd[ds]={meals:{matin:[],midi:[],collation:[],soir:[]}};const row=dd[ds].meals[mid][idx];if(!row)return;if(fld==='food'){row.food=val;row.qty=0;}else row.qty=parseFloat(val)||0;saveDay(dd,ds);}
  function delRow(ds,mid,idx){const dd=JSON.parse(JSON.stringify(days));dd[ds].meals[mid].splice(idx,1);saveDay(dd,ds);}
  function setCalB(ds,v){const dd=JSON.parse(JSON.stringify(days));if(!dd[ds])dd[ds]={meals:{matin:[],midi:[],collation:[],soir:[]}};dd[ds].cal=v;saveDay(dd,ds);}
  function saveCf(){if(!nf.name||!nf.kcal)return;const c={...cf,[nf.name]:{kcal:+nf.kcal,p:+nf.p||0,l:+nf.l||0,g:+nf.g||0,unit:nf.unit}};setCf(c);localSet('foods',c);queueSync('foods',c);flash('✓ '+nf.name);setNf({name:'',kcal:'',p:'',l:'',g:'',unit:'g'});setAF(false);}
  function rTotals(ings){let k=0,p=0,l=0,g=0;ings.forEach(r=>{const f=af[r.food];if(f&&r.qty>0){const gr=gew(f,r.qty);const x=gr/100;k+=f.kcal*x;p+=f.p*x;l+=f.l*x;g+=f.g*x;}});return{kcal:Math.round(k),p:Math.round(p),l:Math.round(l),g:Math.round(g)};}
  function saveRec(){if(!nr.name)return;const ings=nr.ings.filter(i=>i.food&&i.qty>0);if(!ings.length)return;const t=rTotals(ings);const r={...recs,[nr.name]:{portions:Math.max(1,nr.portions||1),desc:nr.desc,ingredients:ings,totals:t}};setRecs(r);localSet('recipes',r);queueSync('recipes',r);flash('✓ '+nr.name);setNr({name:'',portions:1,desc:'',ings:[{food:'',qty:0}]});setRtab('list');}
  function delRec(n){const r={...recs};delete r[n];setRecs(r);localSet('recipes',r);}
  function saveSess(s){setSess(s);localSet('sessions',s);queueSync('sessions',s);flash('✓ Séances');}
  function saveNewSess(){
    if(!ns.title||!ns.date)return;
    const sd={title:ns.title,type:ns.type,duree:+ns.duree,statut:ns.statut,source:'Manuel',calories:+ns.calories||0};
    if(ns.type==='Force')sd.tableau=ns.tableau;
    saveSess({...sess,[ns.date]:sd});
    if(+ns.calories>0)setCalB(ns.date,+ns.calories);
    setNs({date:'',title:'',type:'Cardio',duree:60,statut:'À faire',calories:0,tableau:emptyTab()});
    setAS(false);
  }
  function updSess(ds){
    saveSess({...sess,[ds]:{...editSess}});
    if(+editSess.calories>0)setCalB(ds,+editSess.calories);
    setES(null);
  }
  function delSess(ds){const s={...sess};delete s[ds];saveSess(s);}
  function addCF(name,data){const c={...cf,[name]:data};setCf(c);localSet('foods',c);queueSync('foods',c);}

  async function syncFromCloud(){
    if(!sb||!sbUserRef.current) return;
    const uid=sbUserRef.current.id;
    const {data,error}=await sb.from('user_data').select('*').eq('id',uid).single();
    if(error||!data){
      await sb.from('user_data').upsert({id:uid,days:localGet('days',{}),sessions:localGet('sessions',{}),foods:localGet('foods',{}),recipes:localGet('recipes',{}),coros:localGet('coros',DEFAULT_COROS),updated_at:new Date().toISOString()});
      flash('☁️ Données envoyées dans le cloud');
      return;
    }
    if(data.days&&Object.keys(data.days).length>0){setDays(data.days);localSet('days',data.days);}
    if(data.sessions&&Object.keys(data.sessions).length>0){setSess(data.sessions);localSet('sessions',data.sessions);}
    if(data.foods&&Object.keys(data.foods).length>0){setCf(data.foods);localSet('foods',data.foods);}
    if(data.recipes&&Object.keys(data.recipes).length>0){setRecs(data.recipes);localSet('recipes',data.recipes);}
    if(data.coros&&data.coros.recovery){setCorosData(data.coros);localSet('coros',data.coros);}
    flash('☁️ Sync OK');
  }

  function queueSync(key,val){
    if(!sbUserRef.current) return;
    pendingSync.current={...pendingSync.current,[key]:val};
    clearTimeout(cloudTimer.current);
    cloudTimer.current=setTimeout(async()=>{
      const payload={...pendingSync.current};
      pendingSync.current={};
      setSyncing(true);
      await sb.from('user_data').upsert({id:sbUserRef.current.id,...payload,updated_at:new Date().toISOString()}).catch(()=>{});
      setSyncing(false);
    },2000);
  }

  async function sendMagicLink(){
    if(!sb||!authEmail.trim()) return;
    setAuthLoading(true);
    const redirectTo=window.location.origin+window.location.pathname.replace(/index\.html$/,'');
    const {error}=await sb.auth.signInWithOtp({email:authEmail.trim(),options:{emailRedirectTo:redirectTo}});
    setAuthLoading(false);
    if(error) setAuthMsg('⚠ '+error.message);
    else{setAuthMsg('✓ Lien envoyé ! Vérifie ta boite mail.');setAuthEmail('');}
  }

  function exportData(){const blob=new Blob([JSON.stringify({days,foods:cf,recipes:recs,sessions:sess,coros:corosData},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hyrox_backup_'+today()+'.json';a.click();localStorage.setItem('hyrox_lastexport',String(Date.now()));localStorage.removeItem('hyrox_exportsnooze');setExportReminder(false);flash('✓ Exporté — sauvegarde à jour');}
  function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=evt=>{try{const d=JSON.parse(evt.target.result);if(d.days){setDays(d.days);localSet('days',d.days);}if(d.foods){setCf(d.foods);localSet('foods',d.foods);}if(d.recipes){setRecs(d.recipes);localSet('recipes',d.recipes);}if(d.sessions){setSess(d.sessions);localSet('sessions',d.sessions);}if(d.coros){setCorosData(d.coros);localSet('coros',d.coros);}flash('Import OK');}catch{alert('Erreur JSON');}};reader.readAsText(file);}

  async function sendAI(){
    if(!aiIn.trim())return;

    setAiMsgs(msgs);setAiLoad(true);
    setTimeout(()=>{if(chatRef.current)chatRef.current.scrollTop=chatRef.current.scrollHeight;},50);
    try{
      const t=gt(sel),tgt=gtgt(sel),s=sess[sel];
      const sys='Tu es Coach HYROX. Jour:'+sel+' | '+tgt+'kcal | '+t.kcal+'kcal conso | P:'+t.p+'g L:'+t.l+'g G:'+t.g+'g'+(s?' | Seance:'+s.title:'')+(gb(sel)>0?' | '+gb(sel)+'kcal brulees':'')+' | COROS: Recup '+corosData.recovery+'% FC repos '+corosData.restingHR+' HRV '+corosData.hrvBaseline+' Sommeil '+corosData.sleep.score+'/100. Reponds en francais, max 120 mots.';
      const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:500,system:sys,messages:msgs})});
      const data=await res.json();
      setAiMsgs([...msgs,{role:'assistant',content:data.content?.[0]?.text||'Erreur.'}]);
    }catch{setAiMsgs([...msgs,{role:'assistant',content:'Erreur connexion.'}]);}
    setAiLoad(false);
    setTimeout(()=>{if(chatRef.current)chatRef.current.scrollTop=chatRef.current.scrollHeight;},100);
  }

  const sT=gt(sel),sTgt=gtgt(sel),sSes=sess[sel],sB=gb(sel),sAdj=sTgt+sB,sRem=sAdj-sT.kcal;
  const wk=Array.from({length:7},(_,i)=>{const t=new Date(),dw=t.getDay(),mo=new Date(t);mo.setDate(t.getDate()+(dw===0?-6:1-dw));const d=new Date(mo);d.setDate(mo.getDate()+i);const ds=dstr(d);return{ds,day:['Lu','Ma','Me','Je','Ve','Sa','Di'][i],kcal:gt(ds).kcal,target:gtgt(ds),isTr:istr(ds)};});
  const selLabel=new Date(sel+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
  const mono={fontFamily:"'JetBrains Mono',monospace"};
  const card={background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10};
  const btnB={border:'1px solid var(--border)',borderRadius:6,background:'var(--surface2)',color:'var(--muted)',padding:'5px 11px',fontSize:11,...mono,cursor:'pointer'};
  const btnG={...btnB,borderColor:'var(--accent)',color:'var(--accent)',background:'var(--gi)'};

  function Cal(){
    const months=['Jan','Fev','Mar','Avr','Mai','Juin','Juil','Aou','Sep','Oct','Nov','Dec'];

      const ds=vy+'-'+String(vm+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const isT=ds===today(),isSel=ds===sel,hasSes=!!sess[ds],hasDat=gt(ds).kcal>0;
      let bg='transparent',br='transparent',tc='var(--text)';
      if(isT){bg='var(--accent)';tc='#000';}else if(isSel){br='var(--accent)';}else if(hasSes){bg='rgba(53,212,241,.1)';}
      cells.push(<div key={ds} onClick={()=>{setSel(ds);setCal(false);}} style={{aspectRatio:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',borderRadius:6,cursor:'pointer',border:'1px solid '+br,background:bg,color:tc,fontSize:11,fontWeight:600,gap:2,position:'relative'}}>

  function Nutrition(){

        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>

          <span style={{fontSize:10,padding:'2px 8px',borderRadius:20,background:dtC.bg,color:dtC.tc,border:'1px solid '+dtC.b,...mono}}>{sSes?'SEANCE':'REPOS'}</span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6,marginBottom:8}}>
          {[{v:sT.kcal,l:'Consomme',c:sT.kcal>sAdj?'var(--red)':'var(--accent)'},{v:sAdj,l:sB>0?'Obj.ajuste':'Objectif',c:'var(--orange)'},{v:Math.abs(sRem),l:sRem>=0?'Restantes':'Surplus',c:sRem<0?'var(--red)':'var(--text)'}].map((k,i)=>(
            <div key={i} style={{textAlign:'center',background:'var(--surface2)',borderRadius:8,padding:'7px 4px'}}>
              <div style={{fontSize:17,fontWeight:700,...mono,color:k.c}}>{k.v}</div>
              <div style={{fontSize:9,color:'var(--muted)'}}>{k.l}</div>
            </div>
          ))}
        </div>
        <Bar v={sT.kcal} max={sAdj}/>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:5,marginTop:8}}>
          {[{l:'PROT',v:sT.p,t:MP.p,c:'var(--blue)'},{l:'LIP',v:sT.l,t:MP.l,c:'var(--orange)'},{l:'GLUC',v:sT.g,t:Math.round(sAdj*0.4/4),c:'var(--accent)'}].map(m=>(
            <div key={m.l} style={{background:'var(--surface2)',borderRadius:7,padding:'5px 6px'}}>

                <span style={{color:'var(--muted)',...mono}}>{m.v}g</span>
              </div>
              <Bar v={m.v} max={m.t} c={m.c}/>

          const rows=gm(sel)[slot.id]||[];

          return <div key={slot.id} style={{...card,overflow:'visible'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 10px',borderBottom:'1px solid var(--border)',background:'var(--surface2)',borderRadius:'10px 10px 0 0'}}>
              <span style={{fontSize:13,fontWeight:600}}>{slot.ic} {slot.l}</span>

            </div>

            <div style={{padding:'6px 8px'}}>
              <button onClick={()=>addRow(sel,slot.id)} style={{width:'100%',padding:'6px',fontSize:12,border:'1px dashed var(--border)',borderRadius:6,background:'none',color:'var(--muted)',cursor:'pointer'}}>

              </button>
            </div>
          </div>;
        })}
      </div>

      {/* Aliment custom */}

  function flattenSess(parsed){
    let arr=[];
    parsed.forEach(item=>{
      if(item.seances&&Array.isArray(item.seances)) arr=[...arr,...item.seances];
      else arr.push(item);
    });
    return arr.filter(s=>s.date&&(s.title||s.titre));
  }
  function doImportSess(){
    try{
      const parsed=JSON.parse(impText);
      if(!Array.isArray(parsed))throw 0;
      const valid=flattenSess(parsed);
      if(!valid.length)throw 0;
      const ns2={...sess};
      valid.forEach(s=>{
        ns2[s.date]={title:s.title||s.titre,type:s.type||'Cardio',duree:+s.duree||+s.duree_min||60,statut:s.statut||'À faire',source:s.source||'Notion',calories:+s.calories||0};
        if(s.type==='Force'&&!ns2[s.date].tableau)ns2[s.date].tableau=emptyTab();
      });
      saveSess(ns2);setImpSess(false);setImpText('');flash('✓ '+valid.length+' séance(s) importée(s)');
    }catch{flash('⚠ JSON invalide');}
  }

                <div style={{fontSize:13,fontWeight:600,marginBottom:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{name}{r.desc&&<span style={{fontWeight:400,color:'var(--muted)',fontSize:11}}> — {r.desc}</span>}</div>
                <div style={{display:'flex',gap:6,fontSize:11,...mono,color:'var(--muted)',flexWrap:'wrap'}}>
                  <span>{pp}</span><span style={{color:'var(--blue)'}}>P:{Math.round(r.totals.p/pts)}g</span><span style={{color:'var(--orange)'}}>L:{Math.round(r.totals.l/pts)}g</span><span style={{color:'var(--accent)'}}>G:{Math.round(r.totals.g/pts)}g</span>
                </div>
              </div>
              <button onClick={()=>delRec(name)} style={{...btnB,padding:'5px 10px'}}>🗑</button>
            </div>;
          })}
        </div>}
      </div>}
      {rtab==='create'&&<div style={{...card,padding:12}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:10}}>
          <div style={{gridColumn:'1/-1'}}><label style={{fontSize:10,color:'var(--muted)',...mono,display:'block',marginBottom:3}}>NOM</label><input value={nr.name} onChange={e=>setNr(r=>({...r,name:e.target.value}))} placeholder="Ex: Bol poulet-riz..." inputMode="text" style={{width:'100%',padding:'7px 9px'}}/></div>
          <div><label style={{fontSize:10,color:'var(--muted)',...mono,display:'block',marginBottom:3}}>PORTIONS</label><input type="number" inputMode="decimal" min={1} value={nr.portions} onChange={e=>setNr(r=>({...r,portions:+e.target.value||1}))} style={{width:'100%',padding:'7px 9px'}}/></div>
          <div><label style={{fontSize:10,color:'var(--muted)',...mono,display:'block',marginBottom:3}}>DESC.</label><input value={nr.desc} onChange={e=>setNr(r=>({...r,desc:e.target.value}))} placeholder="Optionnel" inputMode="text" style={{width:'100%',padding:'7px 9px'}}/></div>
        </div>
        <div style={{fontSize:10,color:'var(--muted)',...mono,textTransform:'uppercase',marginBottom:6}}>Ingredients</div>
        {nr.ings.map((ing,idx)=>{const f=af[ing.food];const rk=f&&ing.qty>0?Math.round(f.kcal*gew(f,ing.qty)/100):0;const u=f?(f.unit==='unit'?'u':f.unit==='ml'?'ml':'g'):'g';
          return <div key={idx} style={{display:'flex',gap:6,alignItems:'center',marginBottom:6}}>
            <select value={ing.food} onChange={e=>setNr(r=>{const i=[...r.ings];i[idx]={food:e.target.value,qty:0};return{...r,ings:i};})} style={{flex:1,padding:'5px 6px'}}><option value="">—</option>{Object.keys(af).sort().map(x=><option key={x} value={x}>{x}</option>)}</select>
            <input type="number" inputMode="decimal" min={0} step={f?.unit==='unit'?1:5} value={ing.qty||''} placeholder="Qte" onChange={e=>setNr(r=>{const i=[...r.ings];i[idx]={...i[idx],qty:parseFloat(e.target.value)||0};return{...r,ings:i};})} style={{width:70,padding:'5px 6px',textAlign:'center',...mono}}/>
            <span style={{fontSize:10,color:'var(--muted)',...mono,width:20}}>{u}</span>
            <span style={{fontSize:11,color:'var(--accent)',fontWeight:600,...mono,width:36,textAlign:'right'}}>{rk>0?rk:'—'}</span>
            <button onClick={()=>setNr(r=>({...r,ings:r.ings.filter((_,i)=>i!==idx)}))} style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',fontSize:14}}>✕</button>
          </div>;
        })}
        <button onClick={()=>setNr(r=>({...r,ings:[...r.ings,{food:'',qty:0}]}))} style={{width:'100%',padding:'6px',fontSize:11,border:'1px dashed var(--border)',borderRadius:6,background:'none',color:'var(--muted)',cursor:'pointer',marginBottom:10}}>+ Ingredient</button>
        {(()=>{const t=rTotals(nr.ings.filter(i=>i.food&&i.qty>0));const p=nr.portions||1;return t.kcal>0&&<div style={{display:'flex',gap:8,padding:'7px 9px',background:'var(--surface2)',borderRadius:7,marginBottom:10,flexWrap:'wrap',fontSize:11,...mono}}>
          <span>Total:{t.kcal}kcal</span>{p>1&&<span style={{color:'var(--blue)'}}>→{Math.round(t.kcal/p)}/p</span>}
          <span style={{color:'var(--blue)'}}>P:{Math.round(t.p/p)}g</span><span style={{color:'var(--orange)'}}>L:{Math.round(t.l/p)}g</span><span style={{color:'var(--accent)'}}>G:{Math.round(t.g/p)}g</span>
        </div>;})()}
        <div style={{display:'flex',gap:6}}>
          <button onClick={saveRec} style={{...btnG,flex:1,padding:'8px',textAlign:'center'}}>Sauvegarder</button>
          <button onClick={()=>{setRtab('list');setNr({name:'',portions:1,desc:'',ings:[{food:'',qty:0}]});}} style={{...btnB,padding:'8px 14px'}}>Annuler</button>
        </div>
      </div>}
    </div>;
  }

  function Coach(){
    const rc=corosData.recovery,rcC=rc>=80?'var(--accent)':rc>=60?'var(--orange)':'var(--red)';
    const slC=corosData.sleep.score>=70?'var(--accent)':corosData.sleep.score>=50?'var(--orange)':'var(--red)';
    function saveApiKey(k){setApiKey(k);localStorage.setItem('hyrox_apikey',k);}
    return <div style={{display:'flex',flexDirection:'column',height:'calc(100vh - 200px)'}}>
      <div style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,padding:'10px 12px',marginBottom:8}}>
        <div style={{fontSize:9,...mono,color:'var(--muted)',textTransform:'uppercase',marginBottom:6}}>SYNCHRONISATION CLOUD{syncing&&<span style={{color:'var(--accent)'}}> · ⟳ en cours...</span>}</div>
        {!sbUser
          ?<div>
            <div style={{fontSize:11,color:'var(--muted)',marginBottom:8}}>Connecte-toi pour sauvegarder tes données dans le cloud — survivent aux réinstallations.</div>
            <div style={{display:'flex',gap:6}}>
              <input type="email" inputMode="email" placeholder="ton@email.fr" value={authEmail} onChange={e=>setAuthEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&sendMagicLink()} style={{flex:1,padding:'7px 9px',fontSize:14,borderRadius:6}}/>
              <button onClick={sendMagicLink} disabled={authLoading||!authEmail.trim()} style={{...btnG,padding:'7px 14px',opacity:authLoading||!authEmail.trim()?0.5:1}}>{authLoading?'...':'Envoyer ↗'}</button>
            </div>
            {authMsg&&<div style={{fontSize:10,...mono,color:authMsg.startsWith('⚠')?'var(--orange)':'var(--accent)',marginTop:6}}>{authMsg}</div>}
          </div>
          :<div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{flex:1}}>
              <div style={{fontSize:12,fontWeight:600,color:'var(--accent)'}}>☁️ Connecté</div>
              <div style={{fontSize:10,...mono,color:'var(--muted)'}}>{sbUser.email}</div>
            </div>
            <button onClick={()=>sb.auth.signOut()} style={{...btnB,padding:'5px 10px',fontSize:11}}>Déconnexion</button>
          </div>
        }
      </div>
      {!apiKey
        ?<div style={{background:'var(--oi)',border:'1px solid var(--ob)',borderRadius:8,padding:'8px 11px',marginBottom:8}}>
          <div style={{fontSize:10,...mono,color:'var(--orange)',marginBottom:5}}>⚠ Clé API Anthropic requise pour le Coach IA</div>
          <div style={{display:'flex',gap:6}}>
            <input type="password" placeholder="sk-ant-api03-..." value={apiKey} onChange={e=>saveApiKey(e.target.value)} style={{flex:1,padding:'6px 9px',fontSize:13,borderRadius:6}}/>
          </div>
          <div style={{fontSize:9,color:'var(--muted)',marginTop:4,...mono}}>Stockée localement sur votre appareil · console.anthropic.com</div>
        </div>
        :<div style={{display:'flex',alignItems:'center',gap:8,padding:'5px 10px',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:6,marginBottom:8}}>
          <span style={{fontSize:10,...mono,color:'var(--accent)',flex:1}}>✓ API connectée · ...{apiKey.slice(-6)}</span>
          <button onClick={()=>saveApiKey('')} style={{...btnB,padding:'3px 9px',fontSize:10}}>Modifier</button>
        </div>
      }
      <div style={{background:'var(--si)',border:'1px solid var(--sb)',borderRadius:8,padding:'7px 11px',marginBottom:8,fontSize:11,...mono,color:'var(--blue)'}}>
        {selLabel} · {sSes?'Seance':'Repos'} · {sT.kcal}/{sTgt}kcal{sB>0?' +'+sB+'🔥':''} · P:{sT.p}g
      </div>
      <div style={{marginBottom:10}}>
        <div style={{fontSize:9,...mono,color:'var(--muted)',textTransform:'uppercase',marginBottom:5,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span>COROS · RÉCUPÉRATION</span>
          <span style={{color:'var(--muted)'}}>Sync: {corosData.lastSync}</span>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:6}}>
          {[{l:'RÉCUP',v:rc+'%',c:rcC},{l:'FC REPOS',v:corosData.restingHR,c:'var(--text)'},{l:'HRV',v:corosData.hrvBaseline,c:'var(--blue)'},{l:'SOMMEIL',v:corosData.sleep.score+'/100',c:slC}].map((x,i)=>(
            <div key={i} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,padding:'7px 4px',textAlign:'center'}}>
              <div style={{fontSize:8,color:'var(--muted)',...mono,marginBottom:3}}>{x.l}</div>
              <div style={{fontSize:16,fontWeight:700,...mono,color:x.c}}>{x.v}</div>
            </div>
          ))}
        </div>
        <div style={{display:'flex',gap:10,marginTop:6,padding:'6px 10px',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,fontSize:10,...mono,color:'var(--muted)'}}>
          <span>💤 {corosData.sleep.duration}</span>
          <span style={{color:'var(--blue)'}}>Deep {corosData.sleep.deep}</span>
          <span style={{color:'var(--accent)'}}>REM {corosData.sleep.rem}</span>
        </div>
      </div>
      <div ref={chatRef} style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column',gap:8,paddingBottom:8}}>
        {aiMsgs.length===0&&<div style={{textAlign:'center',padding:'20px',color:'var(--muted)'}}>
          <div style={{fontSize:28,marginBottom:6}}>🤖</div>
          <div style={{fontSize:13,fontWeight:600,marginBottom:12}}>Coach IA pret</div>
          <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:20}}>
            {['Que manger avant ma seance ?','Analyse mes macros','Conseils recuperation ?'].map(q=>(
              <button key={q} onClick={()=>setAiIn(q)} style={{...btnB,borderColor:'var(--sb)',color:'var(--blue)',padding:'9px 12px',textAlign:'left',borderRadius:8,fontSize:12}}>{q} ↗</button>
            ))}
          </div>
          <div style={{borderTop:'1px dashed var(--border)',paddingTop:14}}>
            <div style={{fontSize:10,color:'var(--muted)',marginBottom:10,...mono}}>GESTION DES DONNEES</div>
            <div style={{display:'flex',justifyContent:'center',gap:8}}>
              <button onClick={exportData} style={{...btnB,padding:'8px 14px',fontSize:12}}>📤 Exporter</button>
              <button onClick={()=>fileRef.current.click()} style={{...btnB,padding:'8px 14px',fontSize:12}}>📥 Importer</button>
              <input type="file" ref={fileRef} accept=".json" onChange={importData} style={{display:'none'}}/>
            </div>
          </div>
        </div>}
        {aiMsgs.map((m,i)=>(
          <div key={i} style={{display:'flex',justifyContent:m.role==='user'?'flex-end':'flex-start'}}>
            <div style={{maxWidth:'82%',padding:'9px 12px',borderRadius:10,fontSize:13,lineHeight:1.6,background:m.role==='user'?'var(--si)':'var(--surface)',color:m.role==='user'?'var(--blue)':'var(--text)',border:'1px solid '+(m.role==='user'?'var(--sb)':'var(--border)')}}>{m.content}</div>
          </div>
        ))}
        {aiLoad&&<div style={{display:'flex'}}><div style={{padding:'8px 13px',borderRadius:10,...card,fontSize:13,color:'var(--muted)'}}>Coach reflechit...</div></div>}
      </div>
      <div style={{display:'flex',gap:8,paddingTop:8}}>
        <input ref={aiInputRef} value={aiIn} onChange={e=>setAiIn(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&sendAI()} placeholder="Pose ta question..." inputMode="text" style={{flex:1,padding:'10px 13px',borderRadius:8}}/>
        <button onClick={sendAI} disabled={aiLoad||!aiIn.trim()} style={{...btnG,padding:'10px 16px',fontSize:13,opacity:(aiLoad||!aiIn.trim())?0.5:1}}>↗</button>
      </div>
    </div>;
  }

  return <div style={{minHeight:'100vh',background:'var(--bg)'}}>
    <div className="hdr">
      <div style={{flex:1}}>
        <div style={{fontSize:14,fontWeight:700,letterSpacing:'-0.3px'}}>COACH <span style={{color:'var(--accent)'}}>DASHBOARD</span></div>
        <div style={{fontSize:8,color:'var(--muted)',...mono}}>HYROX · MAASTRICHT 2026</div>
      </div>
      {sbUser
        ?<span style={{fontSize:9,padding:'3px 8px',borderRadius:20,...mono,background:'var(--gi)',color:'var(--accent)',border:'1px solid var(--gb)'}}>{syncing?'⟳ SYNC':'☁️ CLOUD'}</span>
        :<span style={{fontSize:9,padding:'3px 8px',borderRadius:20,...mono,background:'var(--surface2)',color:'var(--muted)',border:'1px solid var(--border)'}}>📱 LOCAL</span>
      }
      {badge&&<span style={{fontSize:9,color:'var(--accent)',...mono,marginLeft:6}}>{badge}</span>}
    </div>

    <div className="cal-hdr" onClick={()=>setCal(o=>!o)}>
      <div style={{flex:1,fontSize:13,fontWeight:600}}>
        <span style={{color:'var(--accent)'}}>{selLabel}</span>
        {sSes&&<span style={{fontSize:10,color:'var(--blue)',marginLeft:6,...mono}}>⚡ {sSes.title.slice(0,22)}{sSes.title.length>22?'...':''}</span>}
      </div>
      <span style={{fontSize:10,color:'var(--muted)',...mono}}>Calendrier</span>
      <span style={{fontSize:16,color:'var(--muted)',marginLeft:4}}>{calOpen?'▲':'▼'}</span>
    </div>
    <div className="cal-body" style={{maxHeight:calOpen?'320px':'0'}}>{Cal()}</div>

    {exportReminder&&<div style={{background:'var(--oi)',borderBottom:'1px solid var(--ob)',padding:'8px 14px',display:'flex',alignItems:'center',gap:8}}>
      <span style={{fontSize:12,flex:1}}>💾 Sauvegarde recommandée — protège tes données</span>
      <button onClick={exportData} style={{...btnG,padding:'4px 10px',fontSize:11}}>📤 Exporter</button>
      <button onClick={()=>{localStorage.setItem('hyrox_exportsnooze',String(Date.now()+2*24*60*60*1000));setExportReminder(false);}} style={{...btnB,padding:'4px 8px',fontSize:11}}>+2j</button>
    </div>}

    <div className="page">
      {tab==='nutrition' &&Nutrition()}
      {tab==='training'  &&Training()}
      {tab==='analytics' &&Analytics()}
      {tab==='recettes'  &&Recettes()}
      {tab==='coach'     &&Coach()}
    </div>

    <nav className="bnav">
      {TABS.map(t=>(
        <button key={t.id} className={'ni'+(tab===t.id?' on':'')} onClick={()=>setTab(t.id)}>
          <span className="ic">{t.ic}</span>
          <span>{t.l}</span>
        </button>
      ))}
    </nav>
  </div>;
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');</script>
</body>
</html>
