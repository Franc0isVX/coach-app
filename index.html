<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coach Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f0f0f;--surface:#1a1a1a;--surface2:#222;--border:#2e2e2e;
  --text:#f0f0f0;--muted:#666;--accent:#c8f135;--orange:#f1a035;--blue:#35d4f1;--red:#ff4d4d;
  --si:rgba(53,212,241,.08);--sb:rgba(53,212,241,.25);
  --gi:rgba(200,241,53,.08);--gb:rgba(200,241,53,.25);
  --oi:rgba(241,160,53,.08);--ob:rgba(241,160,53,.25);
  --nav:58px;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:6px;outline:none;font-size:16px!important;padding:6px 8px;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
select option{background:var(--surface2);}
textarea{resize:none;line-height:1.4;}
.mono{font-family:'JetBrains Mono',monospace;}
/* Nav */
.bnav{position:fixed;bottom:0;left:0;right:0;height:var(--nav);background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom,0px);}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justifyContent:center;gap:2px;border:none;background:none;color:var(--muted);font-size:9px;font-family:'Inter',sans-serif;padding:4px 0;}
.ni.on{color:var(--accent);}
.ni .ic{font-size:20px;line-height:1;}
/* Layout */
.page{padding:10px 12px calc(var(--nav) + 16px + env(safe-area-inset-bottom,0px));max-width:100%;}
/* Cal */
.cal-hdr{display:flex;align-items:center;padding:10px 14px;gap:8px;cursor:pointer;background:var(--surface);border-bottom:1px solid var(--border);}
.cal-body{overflow:hidden;transition:max-height .3s ease;background:var(--surface);border-bottom:1px solid var(--border);}
/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;}
.card2{background:var(--surface2);border:1px solid var(--border);border-radius:8px;}
/* Meals */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:380px){.mg{grid-template-columns:1fr;}}
/* Header */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;}

.small-inputs input, .small-inputs select {
  font-size: 16px !important;
  transform: scale(0.85);
  transform-origin: left center;
  width: 115% !important;
}

/* Styles Tableaux de Force */
.dyn-table-wrapper { width: 100%; overflow-x: auto; margin-bottom: 8px; border-radius: 6px; border: 1px solid var(--border); }
.dyn-table { width: 100%; border-collapse: collapse; min-width: 320px; }
.dyn-table th, .dyn-table td { padding: 4px 6px; border: 1px solid var(--border); text-align: left; }
.dyn-table th { background: var(--surface2); font-size: 10px; color: var(--muted); text-transform: uppercase; }
.dyn-table input { font-size: 14px !important; padding: 4px; width: 100%; border-radius: 4px; border: none; background: transparent; }
.dyn-table input:focus { background: rgba(200,241,53,0.05); }
.dyn-table th input { font-weight: bold; color: var(--text); padding: 0; }

/* Login lock overlay */
.lock-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; padding: 20px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

const APP_PASSWORD = 'hyrox2026maastricht';
const TK    = 1965;
const RK    = 1665;
const MP    = {p:177,l:88};

const MEALS = [{id:'matin',l:'Matin',ic:'☀️'},{id:'midi',l:'Midi',ic:'🌤️'},{id:'collation',l:'Collation',ic:'🍎'},{id:'soir',l:'Soir',ic:'🌙'}];
const TABS  = [{id:'nutrition',ic:'🍽',l:'Nutrition'},{id:'training',ic:'🏋️',l:'Séances'},{id:'analytics',ic:'📊',l:'Stats'},{id:'recettes',ic:'📖',l:'Recettes'},{id:'config',ic:'⚙️',l:'Paramètres'}];

const BF = {
  'Poulet (blanc,cuit)':{kcal:165,p:31,l:3.6,g:0,unit:'g'},
  'Saumon (cuit)':{kcal:208,p:20,l:13,g:0,unit:'g'},
  'Thon en boîte':{kcal:116,p:26,l:1,g:0,unit:'g'},
  'Œufs entiers':{kcal:155,p:13,l:11,g:1,unit:'unit',uw:60},
  "Blancs d'œufs":{kcal:52,p:11,l:0.2,g:1,unit:'unit',uw:35},
  'Bœuf haché 5%':{kcal:137,p:21,l:5,g:0,unit:'g'},
  'Fromage blanc 0%':{kcal:45,p:8,l:0.2,g:3.5,unit:'g'},
  'Skyr nature':{kcal:65,p:11,l:0.2,g:4,unit:'g'},
  'Whey protéine':{kcal:380,p:75,l:5,g:8,unit:'g'},
  'Riz basmati (cuit)':{kcal:130,p:2.7,l:0.3,g:28,unit:'g'},
  'Pâtes (cuites)':{kcal:131,p:5,l:1,g:25,unit:'g'},
  "Flocons d'avoine":{kcal:370,p:13,l:7,g:60,unit:'g'},
  'Pain complet':{kcal:247,p:9,l:3,g:44,unit:'g'},
  'Patate douce (cuite)':{kcal:90,p:2,l:0.1,g:21,unit:'g'},
  'Banane':{kcal:89,p:1.1,l:0.3,g:23,unit:'unit',uw:120},
  'Avocat':{kcal:160,p:2,l:15,g:9,unit:'g'},
  'Amandes':{kcal:579,p:21,l:50,g:22,unit:'g'},
  "Huile d'olive":{kcal:884,p:0,l:100,g:0,unit:'ml'}
};

function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){return dstr(new Date());}
function gew(f,q){if(!f||!q||q<=0)return 0;return f.unit==='unit'?q*(f.uw||100):q;}
function totals(meals,foods){
  let k=0,p=0,l=0,g=0;
  MEALS.forEach(s=>{(meals[s.id]||[]).forEach(r=>{const f=foods[r.food];if(f){const gr=gew(f,r.qty);if(gr>0){const x=gr/100;k+=f.kcal*x;p+=f.p*x;l+=f.l*x;g+=f.g*x;}}});});
  return{kcal:Math.round(k),p:Math.round(p),l:Math.round(l),g:Math.round(g)};
}

function App(){
  const [isAuthed, setIsAuthed] = useState(() => localStorage.getItem('coach_auth') === 'true');
  const [passwordIn, setPasswordIn] = useState('');
  
  const [tab,setTab]     = useState('nutrition');
  const [sel,setSel]     = useState(today());
  const [vy,setVy]       = useState(new Date().getFullYear());
  const [vm,setVm]       = useState(new Date().getMonth());
  const [calOpen,setCal] = useState(false);
  
  // Remplacement du stockage réseau par le LocalStorage local
  const [days,setDays]   = useState(() => JSON.parse(localStorage.getItem('coach_days') || '{}'));
  const [cf,setCf]       = useState(() => JSON.parse(localStorage.getItem('coach_custom_foods') || '{}'));
  const [recs,setRecs]   = useState(() => JSON.parse(localStorage.getItem('coach_recipes') || '{}'));
  const [sess,setSess]   = useState(() => JSON.parse(localStorage.getItem('coach_sessions') || '{}'));
  
  const [badge,setBadge] = useState('');
  const [addFood,setAddFood] = useState(false);
  const [nf,setNf]       = useState({name:'',kcal:'',p:'',l:'',g:'',unit:'g'});
  const [rtab,setRtab]   = useState('list');
  const [nr,setNr]       = useState({name:'',portions:1,desc:'',ings:[{food:'',qty:0}]});
  const [addSess,setAddSess] = useState(false);
  const [editSess,setEditSess] = useState(null);
  const [ns,setNs]       = useState({date:'',title:'',type:'Force',duree:60,statut:'À faire',source:'Manuel',calories:0,notes:'',tableData:{cols:['Exercice','Séries','Réps','Poids'],rows:[['','','','']]}});

  useEffect(() => { localStorage.setItem('coach_days', JSON.stringify(days)); }, [days]);
  useEffect(() => { localStorage.setItem('coach_custom_foods', JSON.stringify(cf)); }, [cf]);
  useEffect(() => { localStorage.setItem('coach_recipes', JSON.stringify(recs)); }, [recs]);
  useEffect(() => { localStorage.setItem('coach_sessions', JSON.stringify(sess)); }, [sess]);

  function handleLogin() {
    if(passwordIn === APP_PASSWORD) { setIsAuthed(true); localStorage.setItem('coach_auth', 'true'); }
    else { alert('Mot de passe incorrect'); }
  }

  function flash(m){setBadge(m);setTimeout(()=>setBadge(''),3000);}

  const af = {...BF,...cf};
  const afw = {...af};
  Object.entries(recs).forEach(([n,r])=>{
    if(r.totals&&r.portions) afw['[R] '+n]={kcal:Math.round(r.totals.kcal/r.portions),p:Math.round(r.totals.p/r.portions*10)/10,l:Math.round(r.totals.l/r.portions*10)/10,g:Math.round(r.totals.g/r.portions*10)/10,unit:'unit',uw:1,ul:'portion(s)'};
  });

  const istr = ds=>{ return !!sess[ds]; };
  const gtgt = ds=>istr(ds)?TK:RK;
  const gm   = ds=>days[ds]?.meals||{matin:[],midi:[],collation:[],soir:[]};
  const gt   = ds=>totals(gm(ds),afw);
  const gb   = ds=>days[ds]?.cal||0;

  function addRow(ds,mid){const dd={...days};if(!dd[ds])dd[ds]={meals:{matin:[],midi:[],collation:[],soir:[]}};dd[ds].meals[mid]=[...(dd[ds].meals[mid]||[]),{food:'',qty:0}];setDays(dd);flash('✓ Saved');}
  function updRow(ds,mid,idx,fld,val){const dd={...days};if(!dd[ds])dd[ds]={meals:{matin:[],midi:[],collation:[],soir:[]}};const row=dd[ds].meals[mid][idx];if(!row)return;if(fld==='food'){row.food=val;row.qty=0;}else row.qty=parseFloat(val)||0;setDays(dd);localStorage.setItem('coach_days', JSON.stringify(dd));}
  function delRow(ds,mid,idx){const dd={...days};dd[ds].meals[mid].splice(idx,1);setDays(dd);flash('✓ Saved');}
  function setCal2(ds,v){const dd={...days};if(!dd[ds])dd[ds]={meals:{matin:[],midi:[],collation:[],soir:[]}};dd[ds].cal=v;setDays(dd);}

  function saveCf(){if(!nf.name||!nf.kcal)return;const c={...cf,[nf.name]:{kcal:+nf.kcal,p:+nf.p||0,l:+nf.l||0,g:+nf.g||0,unit:nf.unit}};setCf(c);flash('✓ '+nf.name);setNf({name:'',kcal:'',p:'',l:'',g:'',unit:'g'});setAddFood(false);}
  function rTotals(ings){let k=0,p=0,l=0,g=0;ings.forEach(r=>{const f=af[r.food];if(f&&r.qty>0){const gr=gew(f,r.qty);const x=gr/100;k+=f.kcal*x;p+=f.p*x;l+=f.l*x;g+=f.g*x;}});return{kcal:Math.round(k),p:Math.round(p),l:Math.round(l),g:Math.round(g)};}
  function saveRec(){if(!nr.name)return;const ings=nr.ings.filter(i=>i.food&&i.qty>0);if(!ings.length)return;const t=rTotals(ings);const r={...recs,[nr.name]:{portions:nr.portions,desc:nr.desc,ingredients:ings,totals:t}};setRecs(r);flash('✓ '+nr.name);setNr({name:'',portions:1,desc:'',ings:[{food:'',qty:0}]});setRtab('list');}
  function delRec(n){const r={...recs};delete r[n];setRecs(r);}

  function saveNewSess(){
    if(!ns.title||!ns.date)return;
    const cleanSess = {...ns, duree:+ns.duree, calories:+ns.calories||0};
    if(ns.type !== 'Force' && ns.type !== 'Renforcement') { delete cleanSess.tableData; }
    setSess({...sess,[ns.date]: cleanSess});
    setNs({date:'',title:'',type:'Force',duree:60,statut:'À faire',source:'Manuel',calories:0,notes:'',tableData:{cols:['Exercice','Séries','Réps','Poids'],rows:[['','','','']]}});
    setAddSess(false);
    flash('✓ Séances');
  }
  function updSess(ds){
    const cleanEdit = {...editSess};
    if(editSess.type !== 'Force' && editSess.type !== 'Renforcement') { delete cleanEdit.tableData; }
    setSess({...sess,[ds]: cleanEdit});
    setEditSess(null);
    flash('✓ Séances');
  }
  function delSess(ds){const s={...sess};delete s[ds];setSess(s);}

  function logSession(ds, s) {
    let txt = ` SÉANCE ${s.type.toUpperCase()} - ${new Date(ds+'T12:00:00').toLocaleDateString('fr-FR')}\n`;
    txt += `Titre : ${s.title}\n`;
    txt += `Durée : ${s.duree} min | Calories : ${s.calories || 0} kcal\n`;
    txt += `Statut : ${s.statut}\n`;
    
    if((s.type === 'Force' || s.type === 'Renforcement') && s.tableData) {
      txt += `\n[TABLEAU DE SÉANCE]\n`;
      s.tableData.rows.forEach(row => {
        const rowString = s.tableData.cols.map((col, idx) => `${col}: ${row[idx] || '—'}`).join(' | ');
        txt += `- ${rowString}\n`;
      });
    }
    
    if(s.notes && s.notes.trim()) {
      txt += `\n[NOTES / RESSENTI]\n${s.notes}\n`;
    }

    navigator.clipboard.writeText(txt)
      .then(() => flash('📋 Copié !'))
      .catch(() => alert('Erreur de copie, vérifie les autorisations de ton navigateur.'));
  }

  function exportData() {
    const backup = { days, cf, recs, sess };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `coach_backup_${today()}.json`;
    a.click();
  }

  function importData(e) {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const res = JSON.parse(evt.target.result);
        if(res.days) setDays(res.days);
        if(res.cf) setCf(res.cf);
        if(res.recs) setRecs(res.recs);
        if(res.sess) setSess(res.sess);
        alert('Importation réussie avec succès !');
      } catch { alert('Fichier invalide'); }
    };
    reader.readAsText(file);
  }

  if(!isAuthed) {
    return <div className="lock-screen">
      <div style={{fontSize:24, fontWeight:700, marginBottom:15, color:'var(--accent)'}}>COACH DASHBOARD</div>
      <input type="password" value={passwordIn} onChange={e=>setPasswordIn(e.target.value)} placeholder="Mot de passe" style={{width:'100%', maxWidth:260, padding:10, textAlign:'center', marginBottom:10}} />
      <button onClick={handleLogin} style={{background:'var(--accent)', color:'#000', padding:'10px 20px', borderRadius:6, border:'none', fontWeight:600, width:'100%', maxWidth:260}}>Accéder</button>
    </div>;
  }

  function Cal(){
    const months=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];
    const fd=new Date(vy,vm,1).getDay(); const off=fd===0?6:fd-1; const dim=new Date(vy,vm+1,0).getDate();
    const cells=[];
    ['Lu','Ma','Me','Je','Ve','Sa','Di'].forEach(d=>cells.push(<div key={'w'+d} style={{textAlign:'center',fontSize:9,color:'var(--muted)',paddingBottom:3,fontFamily:"'JetBrains Mono',monospace"}}>{d}</div>));
    for(let i=0;i<off;i++)cells.push(<div key={'e'+i}/>);
    for(let d=1;d<=dim;d++){
      const ds=vy+'-'+String(vm+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const isT=ds===today(),isSel=ds===sel,hasSes=!!sess[ds],hasDat=gt(ds).kcal>0;
      let bg='transparent',br='transparent',tc='var(--text)';
      if(isT){bg='var(--accent)';tc='#000';} else if(isSel){br='var(--accent)';} else if(hasSes){bg='rgba(53,212,241,.1)';}
      cells.push(<div key={ds} onClick={()=>{setSel(ds);setCal(false);}} style={{aspectRatio:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',borderRadius:6,cursor:'pointer',border:'1px solid '+br,background:bg,color:tc,fontSize:11,fontWeight:600,gap:2,position:'relative'}}>
        <span>{d}</span>
        {hasDat&&<div style={{width:3,height:3,borderRadius:'50%',background:isT?'#000':'var(--blue)'}}/>}
        {hasSes&&!isT&&<div style={{position:'absolute',top:2,right:2,width:4,height:4,borderRadius:'50%',background:'var(--blue)'}}/>}
      </div>);
    }
    return <div style={{padding:'0 10px 10px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
        <button onClick={()=>{let m=vm-1,y=vy;if(m<0){m=11;y--;}setVm(m);setVy(y);}} style={{width:28,height:28,background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:6,fontSize:14}}>‹</button>
        <span style={{fontSize:12,fontWeight:600,fontFamily:"'JetBrains Mono',monospace"}}>{months[vm]} {vy}</span>
        <button onClick={()=>{let m=vm+1,y=vy;if(m>11){m=0;y++;}setVm(m);setVy(y);}} style={{width:28,height:28,background:'var(--surface2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:6,fontSize:14}}>›</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2}}>{cells}</div>
    </div>;
  }

  const sT=gt(sel),sTgt=gtgt(sel),sSes=sess[sel],sB=gb(sel),sAdj=sTgt+sB,sRem=sAdj-sT.kcal;
  const wk=Array.from({length:7},(_,i)=>{const t=new Date(),dw=t.getDay(),mo=new Date(t);mo.setDate(t.getDate()+(dw===0?-6:1-dw));const d=new Date(mo);d.setDate(mo.getDate()+i);const ds=dstr(d);return{ds,day:['Lu','Ma','Me','Je','Ve','Sa','Di'][i],kcal:gt(ds).kcal,target:gtgt(ds),isTr:istr(ds)};});
  const selLabel=new Date(sel+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'});
  const mono={fontFamily:"'JetBrains Mono',monospace"};
  const card={background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10};
  const btnB={border:'1px solid var(--border)',borderRadius:6,background:'var(--surface2)',color:'var(--muted)',padding:'4px 10px',fontSize:10,...mono,cursor:'pointer'};
  const btnG={...btnB,borderColor:'var(--accent)',color:'var(--accent)',background:'var(--gi)'};

  function DynamicWorkoutTable({data, onChange}) {
    const tableData = data || { cols: ['Exercice','Séries','Réps','Poids'], rows: [['','','','']] };
    const addRow = () => { onChange({ ...tableData, rows: [...tableData.rows, Array(tableData.cols.length).fill('')] }); };
    const removeRow = (rIdx) => { const nr = tableData.rows.filter((_, idx) => idx !== rIdx); onChange({ ...tableData, rows: nr.length ? nr : [Array(tableData.cols.length).fill('')] }); };
    const addCol = () => { const colName = prompt("Nom de la colonne ?") || `Col ${tableData.cols.length + 1}`; onChange({ cols: [...tableData.cols, colName], rows: tableData.rows.map(r => [...r, '']) }); };
    const removeCol = (cIdx) => { if(tableData.cols.length <= 1) return; onChange({ cols: tableData.cols.filter((_, idx) => idx !== cIdx), rows: tableData.rows.map(r => r.filter((_, idx) => idx !== cIdx)) }); };
    const updateCell = (rIdx, cIdx, val) => { const nr = tableData.rows.map((row, ri) => ri === rIdx ? row.map((cell, ci) => ci === cIdx ? val : cell) : row); onChange({ ...tableData, rows: nr }); };
    const updateHeader = (cIdx, val) => { const nc = tableData.cols.map((col, ci) => ci === cIdx ? val : col); onChange({ ...tableData, cols: nc }); };

    return <div style={{marginTop: 8, marginBottom: 8}}>
      <div className="dyn-table-wrapper">
        <table className="dyn-table">
          <thead>
            <tr>
              {tableData.cols.map((col, cIdx) => (
                <th key={cIdx}>
                  <div style={{display:'flex', alignItems:'center', gap:4}}>
                    <input value={col} onChange={e => updateHeader(cIdx, e.target.value)} style={{fontSize:'10px!important'}} />
                    <button onClick={() => removeCol(cIdx)} style={{background:'none', border:'none', color:'var(--red)', fontSize:9}}>✕</button>
                  </div>
                </th>
              ))}
              <th style={{width: 30, background:'var(--surface)'}}></th>
            </tr>
          </thead>
          <tbody>
            {tableData.rows.map((row, rIdx) => (
              <tr key={rIdx}>
                {tableData.cols.map((_, cIdx) => (
                  <td key={cIdx}>
                    <input value={row[cIdx] || ''} onChange={e => updateCell(rIdx, cIdx, e.target.value)} placeholder="..." />
                  </td>
                ))}
                <td style={{textAlign:'center', background:'var(--surface)'}}>
                  <button onClick={() => removeRow(rIdx)} style={{background:'none', border:'none', color:'var(--muted)', fontSize:12}}>✕</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{display:'flex', gap:6, marginBottom:10}}>
        <button type="button" onClick={addRow} style={{...btnB, flex:1, padding:'4px 0'}}>+ Ajouter Ligne</button>
        <button type="button" onClick={addCol} style={{...btnB, flex:1, padding:'4px 0'}}>+ Colonne</button>
      </div>
    </div>;
  }

  function Nutrition(){

          {[{l:'PROT',v:sT.p,t:MP.p,c:'var(--blue)'},{l:'LIP',v:sT.l,t:MP.l,c:'var(--orange)'},{l:'GLUC',v:sT.g,t:Math.round(sAdj*0.4/4),c:'var(--accent)'}].map(m=>(

            </div>

        </div>
      </div>
      <div style={{...card,padding:'10px 12px',marginBottom:10}}>
        {sSes&&<div style={{background:'var(--si)',border:'1px solid var(--sb)',borderRadius:7,padding:'7px 10px',marginBottom:8,display:'flex',gap:8,alignItems:'center'}}>
          <span style={{fontSize:16}}>🏋️</span>

            <div style={{fontSize:11,fontWeight:600,marginBottom:2}}>{sSes.title}</div>
            <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>

        </div>}
        <div style={{display:'flex',alignItems:'center',gap:8,background:'var(--surface2)',borderRadius:7,padding:'7px 10px'}}>
          <span style={{fontSize:14}}>🔥</span>
          <span style={{fontSize:11,color:'var(--muted)',flex:1}}>Calories brûlées</span>
          <input type="number" min={0} value={days[sel]?.cal||''} placeholder="0" onChange={e=>setCal2(sel,+e.target.value||0)} style={{width:75,padding:'4px 6px',textAlign:'center',...mono}}/>
          <span style={{fontSize:10,color:'var(--muted)',...mono}}>kcal</span>
        </div>
      </div>
      <div className="mg small-inputs">
        {MEALS.map(slot=>{
          const rows=gm(sel)[slot.id]||[];
          const mk=Math.round(rows.reduce((s,r)=>{const f=afw[r.food];if(!f||!r.qty)return s;return s+(gew(f,r.qty)>0?f.kcal*gew(f,r.qty)/100:0);},0));
          return <div key={slot.id} style={{...card,overflow:'hidden'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 10px',borderBottom:'1px solid var(--border)',background:'var(--surface2)'}}>
              <span style={{fontSize:12,fontWeight:600}}>{slot.ic} {slot.l}</span>
              <span style={{fontSize:11,color:'var(--accent)',fontWeight:600,...mono}}>{mk>0?mk+' kcal':'—'}</span>
            </div>
            {rows.map((row,idx)=>{
              const f=afw[row.food]; const rk=f&&row.qty>0?Math.round(f.kcal*gew(f,row.qty)/100):0; const ul=f?(f.ul||(f.unit==='unit'?'u':f.unit==='ml'?'ml':'g')):'g';
              return <div key={idx} style={{display:'grid',gridTemplateColumns:'1fr 68px 32px 20px',gap:2,alignItems:'center',padding:'3px 7px',borderBottom:'1px solid var(--border)'}}>
                <select value={row.food} onChange={e=>updRow(sel,slot.id,idx,'food',e.target.value)} style={{padding:'2px 3px',borderRadius:4}}>
                  <option value="">—</option>
                  <optgroup label="Recettes">{Object.keys(afw).filter(x=>x.startsWith('[R]')).sort().map(x=><option key={x} value={x}>{x.replace('[R] ','')}</option>)}</optgroup>
                  <optgroup label="Aliments">{Object.keys(afw).filter(x=>!x.startsWith('[R]')).sort().map(x=><option key={x} value={x}>{x}</option>)}</optgroup>
                </select>
                <div style={{display:'flex',alignItems:'center',gap:2}}>
                  <input type="number" min={0} value={row.qty||''} placeholder="0" onChange={e=>updRow(sel,slot.id,idx,'qty',e.target.value)} style={{width:36,padding:'2px 2px',textAlign:'center',...mono}}/>
                  <span style={{fontSize:8,color:'var(--muted)',...mono}}>{ul}</span>
                </div>
                <span style={{fontSize:10,color:'var(--accent)',fontWeight:600,...mono,textAlign:'right'}}>{rk>0?rk:'—'}</span>
                <button onClick={()=>delRow(sel,slot.id,idx)} style={{background:'none',border:'none',color:'var(--muted)',fontSize:12}}>✕</button>
              </div>;
            })}
            <div style={{padding:'3px 7px'}}><button onClick={()=>addRow(sel,slot.id)} style={{width:'100%',padding:'3px',fontSize:10,border:'1px dashed var(--border)',borderRadius:4,background:'none',color:'var(--muted)'}}>+ Ajouter</button></div>
          </div>;
        })}
      </div>
      <div style={{marginTop:10}}>
        {!addFood ? <button onClick={()=>setAddFood(true)} style={{...btnB,width:'100%',padding:'8px',textAlign:'center'}}>⊕ Aliment personnalisé</button>
          : <div style={{...card,padding:12}}>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:5,marginBottom:8}}>
              {[{k:'name',ph:'Nom',full:true},{k:'kcal',ph:'Kcal/100g'},{k:'p',ph:'Prot'},{k:'l',ph:'Lip'},{k:'g',ph:'Glu'}].map(x=>(
                <div key={x.k} style={{gridColumn:x.full?'1/-1':undefined}}><input type={x.k==='name'?'text':'number'} placeholder={x.ph} value={nf[x.k]} onChange={e=>setNf(p=>({...p,[x.k]:e.target.value}))} style={{width:'100%'}}/></div>
              ))}
            </div>
            <div style={{display:'flex',gap:6}}><button onClick={saveCf} style={{...btnG,flex:1}}>Sauvegarder</button><button onClick={()=>setAddFood(false)} style={btnB}>Annuler</button></div>
          </div>
        }
      </div>
    </div>;
  }

  function Training(){

    return <div>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>

        <button onClick={()=>setAddSess(true)} style={btnG}>+ Ajouter</button>
      </div>
      {addSess&&<div style={{...card,padding:12,marginBottom:12}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6,marginBottom:8}}>
          <div><input type="date" value={ns.date} onChange={e=>setNs(s=>({...s,date:e.target.value}))} style={{width:'100%'}}/></div>
          <div><select value={ns.type} onChange={e=>setNs(s=>({ ...s, type:e.target.value, tableData: (e.target.value==='Force'||e.target.value==='Renforcement') ? {cols:['Exercice','Séries','Réps','Poids'],rows:[['','','','']]} : undefined }))} style={{width:'100%'}}>{TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
          <div style={{gridColumn:'1/-1'}}><input value={ns.title} onChange={e=>setNs(s=>({...s,title:e.target.value}))} placeholder="Titre..." style={{width:'100%'}}/></div>
          <div><input type="number" value={ns.duree} onChange={e=>setNs(s=>({...s,duree:e.target.value}))} placeholder="Durée" style={{width:'100%',...mono}}/></div>
          <div><select value={ns.statut} onChange={e=>setNs(s=>({...s,statut:e.target.value}))} style={{width:'100%'}}>{STATUTS.map(t=><option key={t}>{t}</option>)}</select></div>
          <div style={{gridColumn:'1/-1',display:'flex',alignItems:'center',gap:7,background:'var(--surface2)',borderRadius:6,padding:'5px 8px'}}>

            <input type="number" value={ns.calories||''} placeholder="0" onChange={e=>setNs(s=>({...s,calories:e.target.value}))} style={{width:65,textAlign:'center',...mono}}/>

        </div>
        <div style={{display:'flex',gap:6}}><button onClick={saveNewSess} style={{...btnG,flex:1}}>💾 Sauvegarder</button><button onClick={()=>setAddSess(false)} style={btnB}>Annuler</button></div>
      </div>}
      <div style={{display:'flex',flexDirection:'column',gap:7}} className="small-inputs">

          const isEd=editSess?.date===ds; const hasTable = s.type === 'Force' || s.type === 'Renforcement';
          return <div key={ds} style={{...card,padding:'10px 12px',borderColor:ds===sel?'var(--accent)':'var(--border)'}}>
            {isEd ? <div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:5,marginBottom:7}}>
                  <div style={{gridColumn:'1/-1'}}><input value={editSess.title} onChange={e=>setEditSess(x=>({...x,title:e.target.value}))} style={{width:'100%'}}/></div>
                  <select value={editSess.type} onChange={e=>setEditSess(x=>({ ...x, type:e.target.value, tableData: (e.target.value==='Force'||e.target.value==='Renforcement') ? (x.tableData || {cols:['Exercice','Séries','Réps','Poids'],rows:[['','','','']]}) : undefined }))}>{TYPES.map(t=><option key={t}>{t}</option>)}</select>
                  <input type="number" value={editSess.duree} onChange={e=>setEditSess(x=>({...x,duree:e.target.value}))} style={mono}/>

                <div style={{display:'flex',gap:5}}><button onClick={()=>updSess(ds)} style={btnG}>✓ OK</button><button onClick={()=>setEditSess(null)} style={btnB}>Annuler</button><button onClick={()=>delSess(ds)} style={{...btnB,marginLeft:'auto',color:'var(--red)'}}>🗑</button></div>
              </div>
              : <div style={{display:'flex',flexDirection:'column',gap:6}} onClick={()=>setSel(ds)}>
                <div style={{display:'flex',gap:10,alignItems:'center'}}>
                  <div style={{width:34,textAlign:'center'}}>
                    <div style={{fontSize:9,color:'var(--muted)',...mono}}>{new Date(ds+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short'})}</div>
                    <div style={{fontSize:16,fontWeight:700}}>{new Date(ds+'T12:00:00').getDate()}</div>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.title}</div>
                    <div style={{display:'flex',gap:4,flexWrap:'wrap',marginTop:2}}>
                      {[s.type,s.duree+'min',s.calories>0?'🔥'+s.calories+'kcal':null].filter(Boolean).map((t,i)=>(
                        <span key={i} style={{fontSize:9,padding:'1px 5px',borderRadius:4,background:'var(--surface2)',color:'var(--muted)',border:'1px solid var(--border)',...mono}}>{t}</span>
                      ))}
                    </div>
                  </div>
                  <div style={{display:'flex',gap:4}}>
                    <button onClick={e=>{e.stopPropagation(); logSession(ds, s);}} style={{...btnB,color:'var(--blue)',borderColor:'var(--sb)'}}>📋 Log</button>
                    <button onClick={e=>{e.stopPropagation();setEditSess({...s,date:ds});}} style={btnB}>✏️</button>
                  </div>
                </div>
                {hasTable && s.tableData && s.tableData.rows && (
                  <div style={{fontSize:10, background:'var(--surface2)', borderRadius:6, padding:6, border:'1px solid var(--border)', color:'var(--muted)'}}>

                {s.notes && <div style={{fontSize:11, color:'var(--muted)', borderLeft:'2px solid var(--border)', paddingLeft:6, whiteSpace:'pre-wrap'}}>{s.notes}</div>}
              </div>
            }
          </div>;
        })}
      </div>
    </div>;
  }

  function Analytics(){

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
        {[
          {l:'Kcal moy./jour',v:Math.round(wk.filter(w=>w.kcal>0).reduce((s,w)=>s+w.kcal,0)/Math.max(1,wk.filter(w=>w.kcal>0).length)),c:'var(--accent)'},
          {l:'Jours loggés',v:wk.filter(w=>w.kcal>0).length+'/7'},
          {l:'Séances semaine',v:wk.filter(w=>w.isTr).length},
          {l:'Obj. moyen',v:Math.round(wk.reduce((s,w)=>s+w.target,0)/7),c:'var(--orange)'},
        ].map((c,i)=>(
          <div key={i} style={{...card,padding:'10px 12px'}}>
            <div style={{fontSize:10,color:'var(--muted)',marginBottom:3}}>{c.l}</div>
            <div style={{fontSize:22,fontWeight:700,...mono,color:c.c||'var(--text)'}}>{c.v}</div>
          </div>
        ))}
      </div>
      <div style={{...card,padding:12,marginBottom:10}}>
        <div style={{display:'flex',gap:4,alignItems:'flex-end',height:110}}>
          {wk.map((w,i)=>{
            const mx=Math.max(...wk.map(x=>Math.max(x.kcal,x.target)),2200); const h=w.kcal>0?Math.round((w.kcal/mx)*90):0; const th=Math.round((w.target/mx)*90); const isSel=w.ds===sel;
            return <div key={i} onClick={()=>setSel(w.ds)} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:2,cursor:'pointer'}}>

                <div style={{width:'72%',height:Math.max(h,3),background:isSel?'var(--blue)':w.kcal>w.target?'var(--red)':w.kcal>0?'var(--accent)':'var(--border)',borderRadius:'3px 3px 0 0'}}/>
              </div>
              <div style={{fontSize:9,...mono,color:isSel?'var(--blue)':'var(--muted)'}}>{w.day}</div>
            </div>;
          })}
        </div>
      </div>
    </div>;

    </div>
    <nav className="bnav">
      {TABS.map(t=>(<button key={t.id} className={'ni'+(tab===t.id?' on':'')} onClick={()=>setTab(t.id)}><span className="ic">{t.ic}</span><span>{t.l}</span></button>))}
    </nav>
  </div>;
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
